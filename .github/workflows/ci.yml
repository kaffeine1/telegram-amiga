# Host CI for the portable layers (TL parser, crypto, session, JSON):
# the AROS platform file carries complete POSIX fallbacks, so the same
# sources build natively on Linux/macOS and the offline self-tests run
# on every push -- the Amiga targets stay hand-tested on real hardware.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build host binary
        run: make -f Makefile.host all
      - name: Minimum stack cookie contract
        run: strings build/host/Amigram | grep -F '$STACK:1048576' >/dev/null
      - name: MTProto self-test (TL / crypto / SRP / session)
        run: ./build/host/Amigram --mtproto-self-test
      - name: GUI layout self-test
        run: ./build/host/Amigram --gui-self-test
      - name: Chat engine self-test
        run: ./build/host/Amigram --chat-engine-self-test
      - name: Chat transcript renderer golden
        run: ./build/host/Amigram --chat-render-self-test
      - name: Chat list renderer golden
        run: ./build/host/Amigram --chat-list-self-test
      - name: GUI driver projection self-test
        run: ./build/host/Amigram --gui-driver-self-test
      - name: Platform RNG self-test
        run: |
          ./build/host/Amigram --platform-rng-test
          rm -f telegram-seed.bin
      - name: Build with warnings as errors
        run: |
          make -f Makefile.host clean
          make -f Makefile.host all CFLAGS="-Wall -Wextra -Werror -O2"
      - name: Build with self-tests stripped (TG_NO_SELFTEST, -Werror)
        # Guards the stripped-release path: a new self-test helper left
        # outside its TG_NO_SELFTEST region shows up here as an unused
        # function, not on a release build months later.
        run: |
          CPPFLAGS=-DTG_NO_SELFTEST=1 make -f Makefile.host all \
            TARGET=build/host-stripped/Amigram \
            CFLAGS="-Wall -Wextra -Werror -O2"
          ./build/host-stripped/Amigram --mtproto-self-test 2>&1 | \
            grep -F 'Self-tests are not compiled into this build.'
